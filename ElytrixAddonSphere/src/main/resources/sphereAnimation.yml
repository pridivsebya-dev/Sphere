id: sphere
provider: elytrix:sphere

settings:
  # Радиус орбиты в блоках (0.8 – 6.0)
  radius: 2.5

  # Количество предметов на орбите (4 – 24)
  itemCount: 10

  # Базовая скорость вращения орбиты, градусов за тик (1.0 – 20.0)
  rotationSpeed: 7.0

  # Наклон орбиты в градусах — эффект 3D-прецессии (0 – 70)
  precession: 30

  # Высота орбиты над центром кейса в блоках (0.0 – 4.0)
  height: 1.2

  # Частицы-шлейф за предметами. REDSTONE поддерживает цвет ниже.
  particleVector: "REDSTONE"

  # Частицы вокруг победителя в финале. REDSTONE поддерживает цвет ниже.
  particleItems: "REDSTONE"

  # Показывать имена предметов над ними: 1 = да, 0 = нет (0 = меньше нагрузки)
  showItemNames: 1

  # Цвет частиц REDSTONE (RGB)
  red: 255
  green: 105
  blue: 180

  # Тайминги и параметры эффектов.
  # Любой ключ можно удалить — будет использовано значение по умолчанию.
  timings:
    # Тиков разгона каждого предмета при взлёте на орбиту (2 – 15)
    ascentSteps: 5

    # Тиков между запусками предметов — каскад (1 – 5)
    ascentGap: 2

    # Длительность основной фазы орбиты в тиках (20 – 1200)
    orbitTicks: 150

    # Период полного цикла наклона орбиты в тиках (30 – 400).
    # Орбита непрерывно наклоняется до precession градусов и обратно.
    tiltCycleTicks: 80

    # Длительность сжатия орбиты в вихрь в тиках (10 – 200)
    convergenceTicks: 40

    # Длительность показа победителя в тиках (10 – 200)
    winnerTicks: 45

    # Шлейф за предметами раз в N тиков. 0 = отключить шлейф.
    trailPeriod: 2

    # Звук запуска предмета (имя из enum org.bukkit.Sound)
    spawnSound: "BLOCK_NOTE_BLOCK_PLING"

    # Звук победы в конце анимации
    winSound: "ENTITY_PLAYER_LEVELUP"
