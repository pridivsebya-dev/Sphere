id: sphere
provider: elytrix:sphere

settings:
  # Радиус сферы в блоках (0.5 – 8.0)
  radius: 2.5

  # Количество предметов на сфере (4 – 64).
  # 12 = идеально ровный икосаэдр (рекомендую),
  # любое другое = равномерная сетка Фибоначчи.
  itemCount: 12

  # Во сколько раз сжимается сфера к концу вращения (0.3 – 0.95)
  shrink: 0.78

  # Максимальная скорость вращения, градусов за тик (0.5 – 8.0)
  rotationSpeed: 3.0

  # Частицы каркаса сферы. REDSTONE поддерживает цвет ниже.
  particleVector: "REDSTONE"

  # Частицы-аура вокруг предметов (работает при timings.itemAuraPeriod > 0).
  particleItems: "REDSTONE"

  # Показывать имена предметов над ними: 1 = да, 0 = нет (0 = меньше нагрузки на клиент)
  showItemNames: 1

  # Цвет частиц REDSTONE (RGB)
  red: 255
  green: 105
  blue: 180

  # Тайминги и параметры эффектов.
  # Любой ключ можно удалить — будет использовано значение по умолчанию.
  timings:
    # Длительность вращения сферы в тиках (10 – 1200)
    rotationTicks: 160

    # Тиков полёта каждого предмета из центра на своё место (1 – 20)
    spawnSteps: 6

    # Тиков сжатия сферы в центр (1 – 200)
    finalCollapseTicks: 20

    # Сколько тиков победитель держится в центре (0 – 200)
    finalHoldTicks: 15

    # Задержка каркаса в тиках — эффект «шлейфа» (1 – 20)
    wireframeDelayTicks: 3

    # Рисовать каркас раз в N тиков (1 – 10). 2 и выше — меньше пакетов при лагах.
    wireframePeriod: 1

    # Шаг частиц вдоль ребра каркаса, в блоках (0.15 – 2.0)
    wireframeStep: 0.5

    # Отступ частиц от краёв ребра, в блоках (0.0 – 2.0)
    wireframeIndent: 0.35

    # Раз в сколько тиков выпускать частицу-ауру у каждого предмета.
    # 0 = отключить ауру.
    itemAuraPeriod: 0

    # Звук появления предмета (имя из enum org.bukkit.Sound)
    spawnSound: "BLOCK_FIRE_EXTINGUISH"

    # Звук победы в конце анимации
    winSound: "ENTITY_EXPERIENCE_ORB_PICKUP"
